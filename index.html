<!DOCTYPE html>
<!--
  Theme: no data-theme attribute = follow the system. A manual light/dark
  choice is stored in localStorage ("gw-theme") and applied by the inline
  script below before first paint, so there is no flash. Tokens live in
  src/themes.css; src/theme.ts manages the choice at runtime.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Groundwork mark (design/prototype.html); generated by scripts/make_favicons.mts. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1E6B52" />
    <title>Groundwork</title>
    <script>
      try {
        var t = localStorage.getItem('gw-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- First-paint background, mirroring --bg in src/themes.css. -->
    <style>
      html { background-color: #ffffff; color-scheme: light; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background-color: #15191f; color-scheme: dark; } }
      html[data-theme="dark"] { background-color: #15191f; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
