<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Groundwork — prototype</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E6B52'/%3E%3Cpath d='M7 24h18M11 18.5h10M14 13h4M16 6v7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

<!--
  GROUNDWORK UI PROTOTYPE — reference for Claude Code
  Routes (map to DeepSpace file-based routes):
    #/signin       Signed-out gate. Real app: use the DeepSpace SDK sign-in (useAuth / sign-in overlay). Do not build custom auth.
    #/welcome      First run: owner creates the workspace (optionally loads sample documents)
    #/no-access    Signed in but not a member: ask the owner for access
    #/ask          Ask + answers with verified citations, source panel, feedback
    #/documents    Upload dialog, validation errors, statuses, delete confirm
    #/documents/:id/:page  Document viewer: whole document or a specific page, cited passage highlighted.
                   Real app: render PDFs with pdf.js (e.g. react-pdf) from DeepSpace file storage; Markdown/text as styled text.
    #/evals        Eval cases, re-run, changed/unchanged
    #/team         Members, roles, invites (owner manages; others read-only)
    #/404          Not found
  Theme: light/dark toggle in the top bar (and on signed-out screens); default follows the system; "System" option in the account menu.
  Favicon: green rounded square with the Groundwork mark (see <link rel="icon">). Ship favicon.svg + 32px PNG + 180px apple-touch-icon; per-route <title> like "Ask · Groundwork".
  Links: never underlined. Navigational text (document names, back links) uses ink color with a brand-color hover; names and emails are plain text, not links.
  Dropdowns: custom listbox (button + popover, keyboard arrows/Enter/Esc, check on selected, option descriptions). No native <select> styling.
  Ask flow: on send, the textbox clears at once and the question appears in the thread with live steps (searching, reading passages, checking citations) and a shimmer skeleton; the send button shows a spinner; the answer fades in. Failed answers show an inline error with Try again.
  System states: app loading screen (until auth + role are confirmed), reconnecting pill (keep last known role; never fall back to the waiting screen), skeleton rows while lists load, daily question limit, upload progress bar, drag-over dropzone.
  Global components: app shell (sidebar / top bar), account menu (theme, sign out), confirm dialog,
  upload dialog, toast, error banner, empty states, loading states, status pills/badges, citation chip, source panel.
  The "Prototype" menu (bottom-left) and "Preview as" role switcher are for demo only — do not build them.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#FFFFFF; --surface:#F7F8F9; --surface-2:#EFF1F3; --line:#E4E7EB;
  --ink:#1B232E; --ink-2:#4E5866; --ink-3:#6B7480;
  --brand:#1E6B52; --brand-ink:#FFFFFF; --brand-soft:#E7F2EE;
  --amber:#8A5300; --amber-soft:#FBF1E2; --danger:#B42318; --danger-soft:#FDECEA;
  --slate-soft:#EEF0F3; --focus:#2F6FD6; --hl:#FFF3B8;
  --radius-s:8px; --radius-m:12px; --radius-l:16px;
  --shadow:0 8px 28px rgba(27,35,46,.10); --shadow-l:0 24px 60px rgba(27,35,46,.18);
  --font:"Cabin", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#15191F; --surface:#1B2027; --surface-2:#232932; --line:#2E3540;
    --ink:#E9EDF2; --ink-2:#B4BCC7; --ink-3:#97A0AC;
    --brand:#5CC29B; --brand-ink:#0F1A15; --brand-soft:#1C2E27;
    --amber:#E9B062; --amber-soft:#2E2617; --danger:#F28B82; --danger-soft:#3A2220;
    --slate-soft:#252B34; --focus:#7FAEFF; --hl:#4A4120;
    --shadow:0 8px 28px rgba(0,0,0,.45); --shadow-l:0 24px 60px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#15191F; --surface:#1B2027; --surface-2:#232932; --line:#2E3540;
  --ink:#E9EDF2; --ink-2:#B4BCC7; --ink-3:#97A0AC;
  --brand:#5CC29B; --brand-ink:#0F1A15; --brand-soft:#1C2E27;
  --amber:#E9B062; --amber-soft:#2E2617; --danger:#F28B82; --danger-soft:#3A2220;
  --slate-soft:#252B34; --focus:#7FAEFF; --hl:#4A4120;
  --shadow:0 8px 28px rgba(0,0,0,.45); --shadow-l:0 24px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--radius-s);padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;font-size:15px;text-decoration:none}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface)}
.btn-danger{background:var(--danger);color:#fff}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.input,select.input{width:100%;border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;min-height:44px;background:var(--bg)}
.input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.field-help{font-size:13px;color:var(--ink-3)}
.field-error{font-size:13px;color:var(--danger);font-weight:600}
.input[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:13px;color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.link-btn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:inherit}
.link-btn:hover{text-decoration:underline}

/* Auth / centered screens */
.center{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.center-pane{display:flex;align-items:center;justify-content:center;padding:48px 24px}
.card-narrow{width:100%;max-width:380px}
.brand-pane{background:var(--surface);border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:48px}
.brand-pane .demo{max-width:440px;width:100%}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;flex:none}
.auth-title{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:40px 0 8px}
.auth-sub{color:var(--ink-2);margin:0 0 28px}
.oauth{display:flex;flex-direction:column;gap:10px}
.oauth .btn{justify-content:flex-start;padding-left:16px;font-weight:500}
.oauth .btn svg{flex:none}
.legal{font-size:13px;color:var(--ink-3);margin-top:24px}
.demo-q{font-weight:600;font-size:17px;margin:0 0 10px}
.demo-a{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;font-size:15px;line-height:1.7}
.single{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.single .panel{width:100%;max-width:460px}
.single h1{font-size:26px;line-height:1.25;margin:28px 0 8px;letter-spacing:-.015em}
.single p{color:var(--ink-2);margin:0 0 24px}
.check-row{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--radius-s);cursor:pointer}
.check-row input{margin-top:4px;width:18px;height:18px;accent-color:var(--brand)}
.check-row b{display:block;font-size:15px}
.check-row span{font-size:14px;color:var(--ink-2)}
.big-num{font-size:64px;font-weight:700;letter-spacing:-.03em;color:var(--ink-3);margin:0}

/* App shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;background:var(--bg)}
.side .logo{padding:0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-s);color:var(--ink-2);font-weight:500;text-decoration:none;min-height:44px}
.nav a:hover{background:var(--surface)}
.nav a[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav svg{flex:none}
.ws{margin-top:auto;padding:0 8px 52px;font-size:13px;color:var(--ink-3)}
.ws strong{display:block;color:var(--ink-2);font-weight:600;font-size:14px}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;font-weight:600}
.top-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.role{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--ink-2);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.presence{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid var(--bg);margin-left:-8px;color:#fff;flex:none}
.av:first-child{margin-left:0}
.av-lg{width:36px;height:36px;font-size:13px;margin:0;border:0}
.presence-label{font-size:13px;color:var(--ink-3);margin-left:8px}
.acct{position:relative}
.acct-btn{border:0;background:none;padding:0;border-radius:50%;cursor:pointer;min-width:36px;min-height:36px}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:260px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow);padding:8px;z-index:30}
.menu[hidden]{display:none}
.menu-head{padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-head b{display:block;font-size:15px}
.menu-head span{font-size:13px;color:var(--ink-3)}
.menu-label{font-size:13px;color:var(--ink-3);padding:8px 10px 4px}
.menu .seg{margin:0 10px 8px;display:flex}
.menu .seg button{flex:1}
.menu-item{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:10px;border-radius:var(--radius-s);cursor:pointer;text-align:left;min-height:40px;color:var(--ink)}
.menu-item:hover{background:var(--surface)}
.content{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto}
.view{padding:40px 32px 140px;max-width:860px;width:100%;margin:0 auto}
.view:focus{outline:none}
h2.page{margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
.lede{color:var(--ink-2);margin:6px 0 0;max-width:62ch}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

/* Banner */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius-s);background:var(--danger-soft);color:var(--ink);margin-top:24px;font-size:14px}
.banner svg{color:var(--danger);flex:none;margin-top:2px}
.banner b{display:block}

/* Ask */
.thread{display:flex;flex-direction:column;gap:40px;margin-top:36px}
.q{font-size:20px;font-weight:600;line-height:1.35;margin:0}
.q-meta{font-size:13px;color:var(--ink-3);margin-top:4px}
.answer{margin-top:14px;font-size:17px;line-height:1.7}
.answer p{margin:0 0 12px}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;margin:0 2px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--brand);cursor:pointer;vertical-align:2px;line-height:1}
.cite:hover,.cite[aria-expanded="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.status{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--radius-s);margin-top:6px;font-size:14px}
.status svg{flex:none;margin-top:2px}
.status b{font-weight:700;display:block}
.status span{color:var(--ink-2)}
.st-verified{background:var(--brand-soft)} .st-verified b{color:var(--brand)}
.st-partial{background:var(--amber-soft)} .st-partial b{color:var(--amber)}
.st-none{background:var(--slate-soft)}
.removed{font-size:13px;color:var(--ink-3);margin-top:8px}
.fb{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-s);padding:6px 10px;min-height:36px;cursor:pointer;color:var(--ink-2);font-size:14px}
.icon-btn:hover{background:var(--surface)}
.icon-btn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.fb-panel{margin-top:12px;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface)}
.fb-panel textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:var(--radius-s);padding:10px;background:var(--bg);resize:vertical}
.saved{font-size:14px;color:var(--brand);font-weight:600}
.composer-wrap{position:fixed;left:240px;right:0;bottom:0;padding:16px 32px 24px;background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:4}
.composer{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;border:1px solid var(--line);border-radius:var(--radius-m);padding:10px 10px 10px 16px;background:var(--bg);box-shadow:var(--shadow)}
.composer textarea{flex:1;border:0;resize:none;outline:none;background:none;min-height:28px;max-height:160px;padding:8px 0;font-size:16px}
.composer.disabled{opacity:.6}
.progress{display:flex;gap:18px;font-size:14px;color:var(--ink-3);margin-top:14px;flex-wrap:wrap}
.progress span{display:flex;align-items:center;gap:8px}
.progress .done{color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5;display:inline-block}
.progress .active .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:1;transform:scale(1.3)}}
.empty{border:1px dashed var(--line);border-radius:var(--radius-m);padding:28px;margin-top:32px}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{margin:0;color:var(--ink-2);font-size:15px}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.suggest button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--ink-2);min-height:40px}
.suggest button:hover{background:var(--surface);color:var(--ink)}
.source{width:380px;border-left:1px solid var(--line);padding:28px 24px;position:sticky;top:65px;height:calc(100vh - 65px);overflow:auto;background:var(--bg)}
.source[hidden]{display:none}
.source-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.source h3{margin:0;font-size:17px;line-height:1.35}
.source .doc{font-size:14px;color:var(--ink-3);margin-top:4px}
.excerpt{margin-top:20px;font-size:15px;line-height:1.75;color:var(--ink-2)}
.excerpt mark{background:var(--hl);color:var(--ink);padding:1px 2px;border-radius:3px}
.source-note{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);display:flex;gap:8px}
.close{border:0;background:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--ink-3);min-width:36px;min-height:36px}
.close:hover{background:var(--surface)}

/* Tables */
.table-wrap{overflow-x:auto;margin-top:28px}
.table-wrap:has(.dd-menu){overflow:visible}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{text-align:left;font-weight:600;font-size:13px;color:var(--ink-3);padding:0 12px 10px;border-bottom:1px solid var(--line)}
.table td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table td:first-child,.table th:first-child{padding-left:0}
.table td:last-child,.table th:last-child{padding-right:0;text-align:right}
.strong{font-weight:600}
.sub{font-size:13px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-ready{background:var(--brand-soft);color:var(--brand)}
.p-index{background:var(--slate-soft);color:var(--ink-2)}
.p-fail{background:var(--danger-soft);color:var(--danger)}
.p-partial{background:var(--amber-soft);color:var(--amber)}
.p-none{background:var(--slate-soft);color:var(--ink-2)}
.spin{width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.changed{font-size:13px;font-weight:600;color:var(--amber)}
.same{font-size:13px;color:var(--ink-3)}
.locked{margin-top:24px;padding:14px 16px;border-radius:var(--radius-s);background:var(--surface);font-size:14px;color:var(--ink-2)}
.who{display:flex;align-items:center;gap:12px}
.icon-only{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:8px;border-radius:6px;min-width:36px;min-height:36px}
.icon-only:hover{background:var(--surface);color:var(--danger)}
.invite{display:grid;grid-template-columns:1fr 160px auto;gap:10px;align-items:end;margin-top:24px}

/* Dialog */
dialog{border:0;border-radius:var(--radius-l);padding:0;width:min(480px,calc(100vw - 32px));background:var(--bg);color:var(--ink);box-shadow:var(--shadow-l)}
dialog::backdrop{background:rgba(15,20,26,.45)}
.dlg{padding:24px}
.dlg h2{margin:0 0 8px;font-size:20px}
.dlg p{margin:0 0 20px;color:var(--ink-2)}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;flex-wrap:wrap}
.dropzone{border:1.5px dashed var(--line);border-radius:var(--radius-m);padding:28px;text-align:center;background:var(--surface)}
.dropzone p{margin:6px 0 14px;font-size:14px;color:var(--ink-3)}
.file-chip{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-s)}

/* Links: no underlines */
a{color:inherit;text-decoration:none}
.doc-link{color:var(--ink);font-weight:600}
.doc-link:hover{color:var(--brand)}
.link-btn:hover{text-decoration:none;filter:brightness(.85)}

/* Custom dropdown */
.dd{position:relative;display:inline-block}
.dd-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:150px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg);cursor:pointer;font-weight:500;color:var(--ink)}
.dd-btn:hover{background:var(--surface)}
.dd-btn[aria-expanded="true"]{border-color:var(--ink-3)}
.dd-btn svg{color:var(--ink-3);transition:transform .15s}
.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dd-menu{position:absolute;right:0;top:calc(100% + 6px);width:280px;list-style:none;margin:0;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:var(--shadow);z-index:40;text-align:left}
.dd-menu button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:var(--radius-s);cursor:pointer;align-items:flex-start;color:var(--ink)}
.dd-menu button:hover,.dd-menu button:focus-visible{background:var(--surface);outline:none}
.dd-menu b{display:block;font-size:15px;font-weight:600}
.dd-menu small{display:block;color:var(--ink-3);font-size:13px;line-height:1.4;margin-top:2px}
.dd-check{width:16px;flex:none;color:var(--brand);margin-top:3px}

/* Ask: pending answer, steps, skeleton, reveal */
.pending{border:1px solid var(--line);border-radius:var(--radius-m);padding:20px 22px;background:var(--bg)}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.step{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-3)}
.step.active{color:var(--ink);font-weight:600}
.step.done{color:var(--brand)}
.step-ico{width:18px;height:18px;display:grid;place-items:center;flex:none}
.step-ico .ring{width:14px;height:14px;border:2px solid var(--line);border-radius:50%}
.step.active .ring{border-color:var(--brand);border-right-color:transparent;animation:spin .8s linear infinite}
.skel-lines{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.reveal{animation:reveal .4s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}}
.send{width:44px;height:44px;padding:0;border-radius:10px;flex:none}
.send .spin{width:16px;height:16px;border-width:2px}
.st-error{background:var(--danger-soft)} .st-error b{color:var(--danger)}
.limit{display:flex;gap:10px;align-items:center;max-width:860px;margin:0 auto 10px;padding:10px 14px;border-radius:var(--radius-s);background:var(--amber-soft);color:var(--ink);font-size:14px}
.limit svg{color:var(--amber);flex:none}

/* System states */
.boot{min-height:100vh;display:grid;place-items:center}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:18px;color:var(--ink-3);font-size:15px}
.boot .logo-mark{width:48px;height:48px;border-radius:13px;animation:breathe 1.6s ease-in-out infinite}
.boot .logo-mark svg{width:26px;height:26px}
@keyframes breathe{50%{transform:scale(.92);opacity:.75}}
.boot-bar{width:140px;height:3px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.boot-bar i{position:absolute;inset:0;width:40%;background:var(--brand);border-radius:3px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{left:-40%}to{left:100%}}
.reconnect{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.reconnect .spin{width:12px;height:12px}
.skel-row td{padding:18px 12px}
.progressbar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:14px}
.progressbar i{display:block;height:100%;background:var(--brand);width:0;transition:width .15s linear}
.dropzone.drag{border-color:var(--brand);background:var(--brand-soft)}
.waiting-card{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-m);margin-top:12px}

/* Theme toggle */
.theme-btn{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);border-radius:var(--radius-s);min-width:40px;min-height:40px;display:grid;place-items:center;cursor:pointer}
.theme-btn:hover{background:var(--surface);color:var(--ink)}
.theme-float{position:fixed;top:16px;right:16px;z-index:10}

/* Document viewer */
.viewer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:600;min-height:36px}
.back:hover{color:var(--ink)}
.viewer-title{margin:6px 0 0;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:20px;padding:8px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);position:sticky;top:70px;z-index:3}
.tb-group{display:flex;align-items:center;gap:4px}
.tb-sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.tb-btn{border:0;background:none;border-radius:var(--radius-s);min-width:40px;min-height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.tb-btn:hover:not([disabled]){background:var(--bg);color:var(--ink)}
.tb-btn[disabled]{opacity:.35;cursor:not-allowed}
.tb-text{font-size:14px;color:var(--ink-2)}
.page-input{width:56px;text-align:center;border:1px solid var(--line);border-radius:var(--radius-s);min-height:36px;background:var(--bg)}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.viewer{display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px;margin-top:20px}
.thumbs{display:flex;flex-direction:column;gap:12px;position:sticky;top:140px;align-self:start;max-height:calc(100vh - 160px);overflow:auto;padding:2px}
.thumb{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.thumb[aria-current="page"]{outline:2px solid var(--brand);outline-offset:1px}
.thumb-page{aspect-ratio:8.5/11;background:var(--surface);border-radius:3px;padding:8px;display:flex;flex-direction:column;gap:4px}
.thumb-page i{display:block;height:3px;border-radius:2px;background:var(--line)}
.thumb-page i.hl{background:var(--hl)}
.thumb span{font-size:12px;color:var(--ink-3)}
.pages{display:flex;flex-direction:column;gap:20px;align-items:center;overflow-x:auto;padding-bottom:20px}

.pdf-page h4{font-family:var(--font);font-size:1.35em;margin:0 0 .8em;color:#1B232E}
.pdf-page p{margin:0 0 .9em}
.pdf-page mark{background:#FFE58A;color:#1B232E;padding:0 2px;border-radius:2px;box-shadow:0 0 0 2px #FFE58A}
.pdf-page .pg-num{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-family:var(--font);font-size:.8em;color:#6B7480}
.cited-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:.75em;font-weight:700;color:#1E6B52;background:#E7F2EE;border-radius:999px;padding:2px 10px;margin-bottom:.6em}
.md-doc{max-width:680px;width:100%;font-size:16px;line-height:1.75}
.md-doc h4{font-size:20px;margin:28px 0 8px}
.md-doc mark{background:var(--hl);color:var(--ink);padding:1px 2px;border-radius:3px}
.open-page{margin-top:16px}

/* Toast & prototype menu */
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius-s);font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:60}
.toast[hidden]{display:none}
.proto{position:fixed;left:16px;bottom:16px;z-index:50}
.proto-btn{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);min-height:36px}
.proto .menu{left:0;right:auto;top:auto;bottom:calc(100% + 8px)}

@media (max-width: 1180px){ .source{position:fixed;right:0;top:0;height:100vh;z-index:15;box-shadow:var(--shadow)} }
@media (max-width: 900px){
  .center{grid-template-columns:1fr} .brand-pane{display:none}
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);gap:12px;overflow-x:auto}
  .side .logo span:last-child{display:none}
  .nav{flex-direction:row}
  .nav a{padding:8px 10px;white-space:nowrap}
  .ws{display:none}
  .composer-wrap{left:0;padding:12px 16px 16px}
  .top{padding:12px 16px;position:static}
  .view{padding:28px 16px 140px}
  .source{width:100%;top:auto;bottom:0;height:72vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0}
  h2.page{font-size:24px}
  .invite{grid-template-columns:1fr}
  .viewer{grid-template-columns:1fr}
  .thumbs{display:none}
  .toolbar{top:0}
}
@media (max-width: 600px){
  .nav .label-text{display:none}
  .presence{display:none}
  .role > span{display:none}
  .tb-sep{display:none}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }

/* ---------- Document viewer ---------- */
const filler = [
  "This policy applies to all full-time and part-time employees of Northwind Ops unless a separate agreement states otherwise.",
  "Managers are responsible for applying this policy consistently and documenting any approved exceptions.",
  "Questions about this policy should be directed to People Operations. This document is reviewed once a year.",
  "Where this policy conflicts with local law, local law takes precedence for employees in that location.",
];
function pageContent(doc,n){
  const cited = Object.entries(passages).filter(([id,p])=>p.docId===doc.id && p.page===n);
  const hlId = state.hlCite && passages[state.hlCite] && passages[state.hlCite].docId===doc.id && passages[state.hlCite].page===n ? state.hlCite : null;
  let html = cited.length ? `<h4>${esc(cited[0][1].section)}</h4>` : `<h4>${esc(doc.name)}, part ${n}</h4>`;
  html += `<p>${filler[(n)%4]}</p>`;
  cited.forEach(([id,p])=>{
    const text = id===hlId ? p.text : p.text.replace(/<\/?mark>/g,"");
    html += `${id===hlId?'<span class="cited-tag">Cited in your answer</span>':""}<p>${text}</p>`;
  });
  html += `<p>${filler[(n+1)%4]}</p><p>${filler[(n+2)%4]}</p>`;
  return html;
}
function viewViewer(docId, pageN){
  const doc = state.docs.find(d=>d.id===docId);
  if(!doc || doc.status!=="ready") return null;
  const total = doc.pages, n = Math.min(Math.max(1,pageN||1),total);
  const pw = Math.round(640*state.zoom/100);
  const back = `<a class="back" href="#/documents">${I.left}Documents</a>`;
  if(doc.type==="md"){
    return `${back}<div class="viewer-head"><div><h2 class="viewer-title">${esc(doc.name)}</h2><div class="sub">${esc(doc.meta)}</div></div>
      <button class="btn btn-ghost" data-download>${I.download}Download</button></div>
      <article class="md-doc" style="margin-top:24px">${pageContent(doc,1)}</article>`;
  }
  const thumbs = Array.from({length:total},(_,i)=>{
    const hasCite = Object.values(passages).some(p=>p.docId===doc.id&&p.page===i+1);
    return `<button class="thumb" data-page="${i+1}" aria-current="${i+1===n?"page":"false"}" aria-label="Page ${i+1}${hasCite?", contains a cited passage":""}">
      <div class="thumb-page" aria-hidden="true"><i style="width:70%"></i><i></i><i ${hasCite?'class="hl"':""}></i><i style="width:85%"></i><i></i><i style="width:60%"></i></div><span>${i+1}</span></button>`;
  }).join("");
  return `${back}
    <div class="viewer-head"><div><h2 class="viewer-title">${esc(doc.name)}</h2><div class="sub">${esc(doc.meta)}, uploaded by ${esc(doc.by)}</div></div></div>
    <div class="toolbar" role="toolbar" aria-label="Document controls">
      <div class="tb-group">
        <button class="tb-btn" data-page="${n-1}" ${n<=1?"disabled":""} aria-label="Previous page">${I.left}</button>
        <label class="sr-only" for="pageInput">Page number</label>
        <input class="page-input" id="pageInput" inputmode="numeric" value="${n}" aria-describedby="pageTotal">
        <span class="tb-text" id="pageTotal">of ${total}</span>
        <button class="tb-btn" data-page="${n+1}" ${n>=total?"disabled":""} aria-label="Next page">${I.right}</button>
      </div>
      <span class="tb-sep" aria-hidden="true"></span>
      <div class="tb-group">
        <button class="tb-btn" data-zoom="-" ${state.zoom<=60?"disabled":""} aria-label="Zoom out">${I.minus}</button>
        <span class="tb-text" aria-live="polite" style="min-width:44px;text-align:center">${state.zoom}%</span>
        <button class="tb-btn" data-zoom="+" ${state.zoom>=160?"disabled":""} aria-label="Zoom in">${I.plus}</button>
        <button class="btn btn-ghost" data-zoom="fit" style="min-height:36px;padding:6px 12px;font-size:14px">Fit width</button>
      </div>
      <div class="tb-right"><button class="btn btn-ghost" data-download style="min-height:36px;padding:6px 12px;font-size:14px">${I.download}Download</button></div>
    </div>
    <div class="viewer">
      <nav class="thumbs" aria-label="Pages">${thumbs}</nav>
      <div class="pages" style="--page-w:${pw}px">
        <section class="pdf-page" id="page-${n}" aria-label="Page ${n} of ${total}">${pageContent(doc,n)}<div class="pg-num">${n}</div></section>
      </div>
    </div>`;
}

/* ---------- Upload dialog ---------- */
function uploadDialog(){
  openDialog(`<h2 id="dlgTitle">Upload a document</h2>
    <p>PDF, Markdown, or plain text, up to 20 MB. It's indexed automatically and can be searched in about a minute.</p>
    <div class="dropzone" id="dropzone">${I.doc}<p>Drag a file here, or choose one from your computer.</p>
      <div class="row" style="justify-content:center">
        <button class="btn btn-ghost" data-pick="ok">Choose file</button>
        <button class="btn btn-ghost" data-pick="bad" title="Prototype: simulate an unsupported file">Try an unsupported file</button></div></div>
    <div id="pickResult"></div>
    <div class="dlg-actions"><button class="btn btn-ghost" data-dlg="cancel">Cancel</button><button class="btn btn-primary" id="doUpload" disabled>Upload</button></div>`);
}

/* ---------- Ask flow ---------- */
function compose(q){
  const l=q.toLowerCase();
  const base={id:"a"+Date.now(),q,by:"You",vote:null,ups:0,downs:0,fbOpen:false,saved:false,removed:[]};
  if(/remote|home|hours/.test(l)) return {...base,status:"verified",body:"You can work remotely up to three days a week after your first 90 days, with your manager's approval [p:remote-1]. Core hours are 10:00 a.m. to 3:00 p.m. [p:remote-2]",cites:["remote-1","remote-2"]};
  if(/travel|meal|expense|allowance/.test(l)) return {...base,status:"partial",body:"Domestic travel includes a daily meal allowance of $60, and receipts are required for any expense over $25 [p:expense-3]",cites:["expense-3"],removed:["intl-7"]};
  if(/onboard|check-in|buddy|first week/.test(l)) return {...base,status:"verified",body:"Your onboarding buddy schedules a check-in at the end of your first week, and another at day 30 [p:onboard-1]",cites:["onboard-1"]};
  return {...base,status:"none",body:"",cites:[]};
}
function ask(q){
  q=q.trim(); if(!q || state.pending || state.limit) return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  state.pending={q,stage:0}; render();
  const finish=()=>{
    const a = state.aiError ? {id:"a"+Date.now(),q,by:"You",status:"error",body:"",cites:[],removed:[],vote:null,ups:0,downs:0,fbOpen:false,saved:false} : compose(q);
    a.fresh=true; state.answers.push(a); state.pending=null; state.openCite=null; render();
    setTimeout(()=>{a.fresh=false;},500);
  };
  if(reduce){ finish(); return; }
  setTimeout(()=>{ if(state.pending){ state.pending.stage=1; render(); } },700);
  setTimeout(()=>{ if(state.pending){ state.pending.stage=2; render(); } },1400);
  setTimeout(finish,2100);
}

/* ---------- Router & render ---------- */
function route(){ return (location.hash||"#/signin").slice(2); }
function render(){
  const r=route(); const root=$("#root");
  if(state.theme==="system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = state.theme;
  const views={ask:[viewAsk,true],documents:[viewDocs,false],evals:[viewEvals,false],team:[viewTeam,false]};
  const vm = r.match(/^documents\/([^/]+)(?:\/(\d+))?$/);
  if(vm){ const html=viewViewer(vm[1], +vm[2]||1); root.innerHTML = html ? shell("documents", html, false, "Document") : screen404(); return; }
  if(r==="loading"){ root.innerHTML=screenBoot(); return; }
  if(r==="signin") root.innerHTML=screenSignin();
  else if(r==="welcome") root.innerHTML=screenWelcome();
  else if(r==="no-access") root.innerHTML=screenNoAccess();
  else if(views[r]){ root.innerHTML=shell(r, views[r][0](), views[r][1]) + (state.reconnecting?`<div class="reconnect" role="status">${'<span class="spin" aria-hidden="true"></span>'}Reconnecting… your work is safe</div>`:""); renderSource(r); bindComposer(); bindDrop(); }
  else root.innerHTML=screen404();
}
function renderSource(r){
  const el=$("#source"); if(!el) return;
  const id=state.openCite;
  if(!id||r!=="ask"){el.hidden=true;return;}
  const p=passages[id]; el.hidden=false;
  el.innerHTML=`<div class="source-head"><div><h3>${esc(p.section)}</h3><div class="doc">${esc(p.doc)}</div></div>
    <button class="close" id="closeSource" aria-label="Close source">${I.x}</button></div>
    <div class="excerpt">${p.text}</div>
    <div class="source-note">${I.shield}<span>This passage was retrieved for the answer and matched the citation on the server.</span></div>
    <a class="btn btn-ghost btn-block open-page" href="#/documents/${p.docId}/${p.page}" data-open-cite="${id}">Open ${p.page>1||passages[id].docId!=="d3"?`page ${p.page}`:"document"} in ${esc(p.doc)}</a>`;
}
function bindDrop(){}
function bindComposer(){
  const f=$("#composer"); if(!f) return;
  const ta=$("#qInput");
  f.addEventListener("submit",e=>{e.preventDefault(); const v=ta.value; ta.value=""; ask(v);});
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault(); f.requestSubmit();} });
  ta.addEventListener("input",()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,160)+"px"; });
}
window.addEventListener("hashchange",()=>{state.openCite=null;state.menuOpen=false;render(); const v=$("#view"); if(v) v.focus(); window.scrollTo(0,0);});
darkMQ.addEventListener("change",()=>{ if(state.theme==="system") render(); });

/* ---------- Events ---------- */
document.addEventListener("submit",e=>{
  if(e.target.id==="wsForm"){
    e.preventDefault(); const name=$("#wsName").value.trim();
    if(!name){ $("#wsErr").hidden=false; $("#wsName").setAttribute("aria-invalid","true"); $("#wsName").focus(); return; }
    state.workspace=name;
    if(!$("#wsSample").checked){ state.docs=[]; state.answers=[]; }
    location.hash="#/ask"; toast(`Created ${name}`);
  }
  if(e.target.id==="inviteForm"){
    e.preventDefault(); const em=$("#invEmail").value.trim();
    if(!/^\S+@\S+\.\S+$/.test(em)){ $("#invErr").hidden=false; $("#invEmail").setAttribute("aria-invalid","true"); $("#invEmail").focus(); return; }
    state.invites.unshift({email:em,role:$("#invRole").value,sent:"just now"}); render(); toast(`Invite sent to ${em}`);
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="pageInput"){
    const m=route().match(/^documents\/([^/]+)/), doc=state.docs.find(x=>x.id===m[1]);
    const n=Math.min(Math.max(1,parseInt(e.target.value,10)||1),doc.pages);
    location.hash=`#/documents/${m[1]}/${n}`; return;
  }
  const s=e.target.closest("[data-rolefor]"); if(!s) return;
  const m=state.members.find(x=>x.id===s.dataset.rolefor); m.role=s.value; toast(`${m.name} is now ${roleName(m.role).toLowerCase()}`);
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a"); 
  if(!e.target.closest(".acct") && state.menuOpen){ state.menuOpen=false; const m=$("#acctMenu"); if(m) m.hidden=true; const b=$("#acctBtn"); if(b) b.setAttribute("aria-expanded","false"); }
  if(!e.target.closest(".proto")){ $("#protoMenu").hidden=true; $("#protoBtn").setAttribute("aria-expanded","false"); }
  if(state.openDD && !e.target.closest(".dd")){ state.openDD=null; render(); }
  if(!t) return;
  const d=t.dataset;
  if(d.ddToggle){ state.openDD = state.openDD===d.ddToggle ? null : d.ddToggle; render(); const first=document.querySelector('.dd-menu [aria-selected="true"] button')||document.querySelector(".dd-menu button"); if(first) first.focus({preventScroll:true}); return; }
  if(d.ddPick){
    const id=d.ddPick, v=d.value; state.openDD=null;
    if(id.startsWith("role-")){ const m=state.members.find(x=>"role-"+x.id===id); if(m && m.role!==v){ m.role=v; toast(`${m.name} is now ${roleName(v).toLowerCase()}`); } }
    render(); const b=document.querySelector(`[data-dd-toggle="${id}"]`); if(b) b.focus(); return;
  }
  if(d.approve){
    const w=state.waiting.find(x=>x.id===d.approve); state.waiting=state.waiting.filter(x=>x.id!==w.id);
    state.members.push({id:"m"+Date.now(),name:w.name,email:w.email,role:d.as,color:w.color}); render(); toast(`${w.name} can now use Groundwork as ${roleName(d.as).toLowerCase()}`); return;
  }
  if(d.retryAsk){ const a=state.answers.find(x=>x.id===d.retryAsk); state.answers=state.answers.filter(x=>x!==a); state.aiError=false; ask(a.q); return; }
  if(t.id==="protoBtn"){ const m=$("#protoMenu"); m.hidden=!m.hidden; t.setAttribute("aria-expanded",!m.hidden); return; }
  if(d.go){ location.hash=d.go; $("#protoMenu").hidden=true; return; }
  if(d.sim){
    $("#protoMenu").hidden=true;
    if(d.sim==="empty"){ state.docs=[]; state.answers=[]; state.evals=[]; location.hash="#/ask"; render(); toast("Showing an empty workspace"); }
    if(d.sim==="aierror"){ state.aiError=true; location.hash="#/ask"; render(); toast("Next question will fail, to show the error state"); }
    if(d.sim==="reconnect"){ state.reconnecting=true; render(); setTimeout(()=>{state.reconnecting=false;render();toast("Reconnected");},2600); }
    if(d.sim==="slow"){ state.loadingLists=true; location.hash = /team|documents/.test(route())?location.hash:"#/documents"; render(); setTimeout(()=>{state.loadingLists=false;render();},1800); }
    if(d.sim==="limit"){ state.limit=!state.limit; location.hash="#/ask"; render(); }
    if(d.sim==="clearerr"){ state.aiError=false; render(); }
    if(d.sim==="reset"){ Object.assign(state,seed(),{aiError:false,limit:false,reconnecting:false,pending:null}); render(); toast("Demo data reset"); }
    return;
  }
  if(d.signin!==undefined){ location.hash="#/welcome"; return; }
  if(d.signout!==undefined){ state.menuOpen=false; location.hash="#/signin"; toast("Signed out"); return; }
  if(d.copy!==undefined){ toast("Email copied"); return; }
  if(t.id==="acctBtn"){ state.menuOpen=!state.menuOpen; $("#acctMenu").hidden=!state.menuOpen; t.setAttribute("aria-expanded",state.menuOpen); return; }
  if(d.themeSet){ state.theme=d.themeSet; state.menuOpen=true; render(); return; }
  if(d.themeToggle!==undefined){ state.theme = effectiveTheme()==="dark" ? "light" : "dark"; render(); toast(`${state.theme==="dark"?"Dark":"Light"} mode. Choose System in your account menu to follow your device.`); return; }
  if(d.openCite){ state.hlCite=d.openCite; state.openCite=null; return; }
  if(d.page){ const m=route().match(/^documents\/([^/]+)/); if(m) location.hash=`#/documents/${m[1]}/${d.page}`; return; }
  if(d.zoom){ state.zoom = d.zoom==="fit" ? 100 : Math.min(160,Math.max(60,state.zoom+(d.zoom==="+"?20:-20))); render(); return; }
  if(d.download!==undefined){ toast("Download started"); return; }
  if(d.role){ state.role=d.role; render(); toast(`Previewing as ${roleName(d.role).toLowerCase()}`); return; }
  if(d.cite){ state.openCite=state.openCite===d.cite?null:d.cite; renderSource("ask"); document.querySelectorAll(".cite").forEach(c=>c.setAttribute("aria-expanded",c.dataset.cite===state.openCite)); return; }
  if(t.id==="closeSource"){ state.openCite=null; renderSource("ask"); document.querySelectorAll(".cite").forEach(c=>c.setAttribute("aria-expanded","false")); return; }
  if(d.suggest){ ask(d.suggest); return; }
  if(d.vote){
    const a=state.answers.find(x=>x.id===d.id), v=d.vote;
    if(a.vote===v){ a.vote=null; v==="up"?a.ups--:a.downs--; a.fbOpen=false; }
    else{ if(a.vote==="up")a.ups--; if(a.vote==="down")a.downs--; a.vote=v; v==="up"?a.ups++:a.downs++; a.fbOpen=v==="down"; }
    render(); return;
  }
  if(d.save){ const a=state.answers.find(x=>x.id===d.save); a.saved=true; state.evals.push({q:a.q,last:a.status,run:"Today",change:null}); render(); toast("Saved as eval case"); return; }
  if(d.closefb){ state.answers.find(x=>x.id===d.closefb).fbOpen=false; render(); return; }
  if(d.upload!==undefined){ uploadDialog(); return; }
  if(d.pick){
    const ok=d.pick==="ok";
    $("#pickResult").innerHTML = ok
      ? `<div class="file-chip"><div><div class="strong">Intern Program Guide.pdf</div><div class="sub">PDF, 4 pages, 1.2 MB</div></div><span class="pill p-ready">Ready to upload</span></div>`
      : `<div class="file-chip" style="border-color:var(--danger)"><div><div class="strong">team-photo.png</div><div class="field-error">Images aren't supported. Upload a PDF, Markdown, or text file.</div></div></div>`;
    $("#doUpload").disabled=!ok; return;
  }
  if(t.id==="doUpload"){
    t.disabled=true; t.innerHTML='<span class="spin" aria-hidden="true"></span>Uploading';
    $("#pickResult").insertAdjacentHTML("beforeend",`<div class="progressbar" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="pbar"></i></div><div class="hint" id="ptext" style="margin-top:6px">Uploading 0%</div>`);
    let pct=0; const timer=setInterval(()=>{ pct=Math.min(100,pct+12); const b=$("#pbar"); if(b){b.style.width=pct+"%"; b.parentElement.setAttribute("aria-valuenow",pct); $("#ptext").textContent=pct<100?`Uploading ${pct}%`:"Uploaded. Indexing will continue in the background.";}
      if(pct>=100){ clearInterval(timer); setTimeout(()=>{ closeDialog();
        const doc={id:"d"+Date.now(),name:"Intern Program Guide",meta:"PDF, 4 pages",type:"pdf",pages:4,by:"You",status:"indexing"};
        state.docs.unshift(doc); render(); toast("Indexing Intern Program Guide");
        setTimeout(()=>{ doc.status="ready"; render(); toast("Intern Program Guide is ready to search"); },2400); },500); } },120);
    return;
  }
  if(d.retry){ const doc=state.docs.find(x=>x.id===d.retry); doc.status="indexing"; render(); setTimeout(()=>{doc.status="ready";render();},1800); return; }
  if(d.del){
    const doc=state.docs.find(x=>x.id===d.del);
    confirmDialog({title:`Delete ${doc.name}?`,body:"It will be removed from search for everyone in the workspace. Past answers that cited it will keep their citations, marked as from a deleted document.",action:"Delete document",
      onConfirm:()=>{ state.docs=state.docs.filter(x=>x.id!==doc.id); render(); toast(`Deleted ${doc.name}`); }});
    return;
  }
  if(d.remove){
    const m=state.members.find(x=>x.id===d.remove);
    confirmDialog({title:`Remove ${m.name}?`,body:"They'll lose access to this workspace right away. Their past questions and feedback stay.",action:"Remove member",
      onConfirm:()=>{ state.members=state.members.filter(x=>x.id!==m.id); render(); toast(`Removed ${m.name}`); }});
    return;
  }
  if(d.revoke!==undefined){ const v=state.invites.splice(+d.revoke,1)[0]; render(); toast(`Revoked invite for ${v.email}`); return; }
  if(d.dlg==="cancel"){ closeDialog(); return; }
  if(d.dlg==="confirm"){ closeDialog(); if(confirmDialog._cb) confirmDialog._cb(); return; }
  if(t.id==="runEvals"){
    t.disabled=true; t.textContent="Re-running…";
    setTimeout(()=>{
      const intern=state.docs.some(x=>x.name==="Intern Program Guide"&&x.status==="ready");
      state.evals.forEach(e=>{ const before=e.last; if(/intern/i.test(e.q)&&intern) e.last="verified"; e.change=e.last!==before; e.run="Just now"; });
      render(); toast("Evals re-run");
    },1200);
  }
});
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{ const z=e.target.closest&&e.target.closest("#dropzone"); if(z){ e.preventDefault(); z.classList.add("drag"); } }));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{ const z=e.target.closest&&e.target.closest("#dropzone"); if(z){ e.preventDefault(); z.classList.remove("drag"); if(ev==="drop") z.querySelector('[data-pick="ok"]')?.click(); } }));
document.addEventListener("keydown",e=>{
  const vm=route().match(/^documents\/([^/]+)\/(\d+)$/);
  if(vm && (e.key==="ArrowLeft"||e.key==="ArrowRight") && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    const doc=state.docs.find(x=>x.id===vm[1]); const n=+vm[2]+(e.key==="ArrowRight"?1:-1);
    if(doc && n>=1 && n<=doc.pages) location.hash=`#/documents/${vm[1]}/${n}`; return;
  }
  if(e.key==="Enter" && e.target.id==="pageInput"){ e.target.dispatchEvent(new Event("change",{bubbles:true})); return; }
  if(state.openDD && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    const items=[...document.querySelectorAll(".dd-menu button")]; const i=items.indexOf(document.activeElement);
    const n = e.key==="ArrowDown" ? Math.min(items.length-1,i+1) : Math.max(0,i-1); items[n]?.focus(); e.preventDefault(); return;
  }
  if(e.key!=="Escape") return;
  if(state.openDD){ const id=state.openDD; state.openDD=null; render(); document.querySelector(`[data-dd-toggle="${id}"]`)?.focus(); return; }
  if(state.openCite){ state.openCite=null; renderSource(route()); }
  if(state.menuOpen){ state.menuOpen=false; const m=$("#acctMenu"); if(m) m.hidden=true; $("#acctBtn")?.focus(); }
  $("#protoMenu").hidden=true;
});
(function boot(){
  const target=route();
  if(target==="loading"){ render(); return; }
  $("#root").innerHTML=screenBoot();
  setTimeout(render, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 900);
})();
</script>
